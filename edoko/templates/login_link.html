{% extends "base.html" %}
{% block title %}{{ _("Log in") }} – e-DoKo{% endblock %}
{% block content %}
<h1>{{ _("Hello %(name)s", name=user.name) }}</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">{{ _("Log in") }}</button>
</form>
{% endblock %}
