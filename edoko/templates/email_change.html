{% extends "base.html" %}
{% block title %}{{ _("New email address") }} – e-DoKo{% endblock %}
{% block content %}
<h1>{{ _("New email address") }}</h1>
<p>{{ _("Change the address of your account from %(old)s to %(new)s?", old=current_user.email, new=change.new_email) }}</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <button type="submit">{{ _("Yes, change it") }}</button>
</form>
{% endblock %}
